# 关注公司清单 —— 想加/删公司直接改这个文件，然后重启（或执行 python cli.py init-db）
#
# market: US=美股  HK=港股  PRIVATE=未上市公司
# 美股只填 ticker（SEC 的 CIK 会自动从 SEC 官方映射表解析并缓存）
# 港股只填 code（港交所内部 stockId 会自动解析并缓存）
# aliases: 把新闻匹配到该公司的关键词（英文不区分大小写、按词匹配；中文按子串匹配）
#          尽量别用太宽泛的中文词（比如「理想」这种常用词），避免误匹配

