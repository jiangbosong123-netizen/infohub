# 覆盖范围（D31，docs/spec/PLATFORM_DESIGN.md 第四节）。
#
# 档位按市场规则划，高档包含低档。现在用哪一档由 .env 的 INFOHUB_COVERAGE_TIER 决定：
# 0 = 只有 watchlist.yaml（默认，什么都不变）；1、2、3 = 下面对应的档。改范围只改这里或那个数字，不改代码。
# 行业用 Nasdaq 股票筛选器的分类（security_master.industry / sector），市值单位美元。
# 覆盖进来的公司（companies.origin = coverage）只接 SEC 公告和 Nasdaq 个股新闻源，不建主题页、不用 Google News 逐家搜；
# watchlist.yaml 里的公司照旧。

tiers:
  1:
    name: AI 算力产业链（半导体与硬件）
    min_market_cap: 1000000000
    industries:                  # 任何板块
      - Semiconductors
      - Electronic Components
      - Computer Manufacturing
      - Computer peripheral equipment
      - Computer Communications Equipment
    technology_industries:       # 只算科技板块：同名行业在其他板块里混有电信运营商等
      - Industrial Machinery/Components
      - Electrical Products
      - Telecommunications Equipment
      - "Retail: Computer Software & Peripheral Equipment"
  2:
    name: 美股市值前 100
    top_market_cap: 100
  3:
    name: 美股市值前 500
    top_market_cap: 500

# 调用方的覆盖申请：只决定"多采哪些公司"，不进数据结构，也不影响别人查到什么。名单变了只改这里。
# 档位 >= 1 时生效。按 SEC 编号（CIK）写，注释里是当时的代码。
# Names headlines use that the listed name does not give (company_match matches them as written,
# any case, as whole words). Only for names no other company or common word shares.
extra_aliases:
  19617: [JPMorgan]  # listed as "JP Morgan Chase & Co."

# Banks whose name in other feeds is mostly their analysts rating other companies ("JPMorgan cuts
# XPeng target"): about half of their mentions on 10-27. They are linked only by their own Nasdaq
# feed (names and extra aliases above apply there), their SEC filings and their $ticker.
own_feed_only: [19617, 70858, 72971, 831001, 886982, 895421]

