x-infohub-common: &infohub-common
  # Each version is its own image, so the previous one is still there to roll back to. It is
  # always built from this checkout, never pulled.
  image: infohub:${APP_VERSION:-unknown}
  pull_policy: build
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-unknown}
  volumes:
    - ./data:/app/data
  # tini as PID 1 forwards stop signals to Python and reaps child processes.
  init: true
  # Docker keeps container logs forever by default; keep 5 x 10 MB per container.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-infohub-environment: &infohub-environment
  INFOHUB_ENVIRONMENT: production
  INFOHUB_ENVIRONMENT_ID: ${INFOHUB_ENVIRONMENT_ID:-windows-production}
  INFOHUB_DB_PATH: /app/data/app.db
  INFOHUB_BLOB_PATH: /app/data/blobs
  INFOHUB_BACKUP_PATH: /app/data/backups
  INFOHUB_RUNTIME_PATH: /app/data/runtime
  INFOHUB_DURABLE_JOBS_ENABLED: "true"
  INFOHUB_CURATED_FEED_ENABLED: ${INFOHUB_CURATED_FEED_ENABLED:-true}
  INFOHUB_CURATION_READ_ENABLED: ${INFOHUB_CURATION_READ_ENABLED:-false}
  INFOHUB_CURATION_SEARCH_ENABLED: ${INFOHUB_CURATION_SEARCH_ENABLED:-false}
  INFOHUB_CURATION_HOT_ENABLED: ${INFOHUB_CURATION_HOT_ENABLED:-false}
  INFOHUB_TOPIC_STATISTICS_ENABLED: ${INFOHUB_TOPIC_STATISTICS_ENABLED:-false}
  INFOHUB_TOPIC_READ_ENABLED: ${INFOHUB_TOPIC_READ_ENABLED:-false}
  INFOHUB_REPORT_READ_ENABLED: ${INFOHUB_REPORT_READ_ENABLED:-false}
  INFOHUB_REPORT_WRITE_ENABLED: ${INFOHUB_REPORT_WRITE_ENABLED:-false}
  INFOHUB_API_CATALOG_ENABLED: ${INFOHUB_API_CATALOG_ENABLED:-false}
  INFOHUB_API_ITEMS_ENABLED: ${INFOHUB_API_ITEMS_ENABLED:-false}
  INFOHUB_API_EVENTS_ENABLED: ${INFOHUB_API_EVENTS_ENABLED:-false}
  INFOHUB_API_ANALYSES_ENABLED: ${INFOHUB_API_ANALYSES_ENABLED:-false}
  INFOHUB_API_EVIDENCE_ENABLED: ${INFOHUB_API_EVIDENCE_ENABLED:-false}
  INFOHUB_API_SYNC_ENABLED: ${INFOHUB_API_SYNC_ENABLED:-false}
  INFOHUB_PUBLIC_ORIGIN: ${INFOHUB_PUBLIC_ORIGIN:-}
  APP_TZ: ${APP_TZ:-Asia/Shanghai}

services:
  migrate:
    <<: *infohub-common
    restart: "no"
    command: ["python", "cli.py", "prepare-release"]
    # The image's web healthcheck means nothing for a one-shot migration.
    healthcheck:
      disable: true
    environment:
      <<: *infohub-environment
      INFOHUB_PROCESS_ROLE: maintenance
      INFOHUB_ALLOW_NETWORK_TASKS: "false"
      INFOHUB_ENABLE_SCHEDULER: "false"

  infohub:
    <<: *infohub-common
    container_name: infohub
    restart: unless-stopped
    command: ["python", "cli.py", "serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *infohub-environment
      INFOHUB_PROCESS_ROLE: web
      INFOHUB_ALLOW_NETWORK_TASKS: "false"
      INFOHUB_ENABLE_SCHEDULER: "false"
      WEB_HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      # serve verifies the whole database before it listens (minutes on a multi-GB database).
      start_period: 600s
      retries: 3

  worker:
    <<: *infohub-common
    env_file:
      - .env
    container_name: infohub-worker
    restart: unless-stopped
    command: ["python", "cli.py", "worker"]
    # On SIGTERM the worker finishes its current job before exiting (a crawl cycle takes a minute
    # or two). Docker's default 10 s kills it mid-job; a job still running after 3 minutes is
    # killed and retried after its lease expires.
    stop_grace_period: 3m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *infohub-environment
      INFOHUB_PROCESS_ROLE: worker
      INFOHUB_ALLOW_NETWORK_TASKS: "true"
      INFOHUB_ENABLE_SCHEDULER: "true"
    healthcheck:
      test: ["CMD", "python", "cli.py", "worker-health"]
      interval: 30s
      timeout: 5s
      # The worker also verifies the whole database before its first heartbeat.
      start_period: 600s
      retries: 3
