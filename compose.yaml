services:
  infohub:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    container_name: infohub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INFOHUB_ENVIRONMENT: production
      INFOHUB_ENVIRONMENT_ID: ${INFOHUB_ENVIRONMENT_ID:-windows-production}
      INFOHUB_DB_PATH: /app/data/app.db
      INFOHUB_BLOB_PATH: /app/data/blobs
      INFOHUB_BACKUP_PATH: /app/data/backups
      INFOHUB_ALLOW_NETWORK_TASKS: "true"
      INFOHUB_ENABLE_SCHEDULER: "true"
      # Rollout gate only; P04a creates the durable foundation without switching workers.
      INFOHUB_DURABLE_JOBS_ENABLED: "false"
      WEB_HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
