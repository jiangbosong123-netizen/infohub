name: Dependency audit
# The locked dependencies against newly published advisories, weekly, even when nothing is merged.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit --requirement requirements.txt --require-hashes --disable-pip --progress-spinner off
