name: Checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.13.3 pip-audit==2.9.0
      # Pyflakes rules only: undefined names, unused imports and variables.
      - run: ruff check --select F app cli.py tests
      # Known vulnerabilities in the locked dependency set.
      - run: pip-audit --requirement requirements.txt --require-hashes --disable-pip --progress-spinner off
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The same pinned, hash-checked set the image installs.
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m compileall -q app cli.py
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      INFOHUB_PUBLIC_ORIGIN: https://infohub-ci.example.ts.net
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      # The tests again, on the image's Python, packages and compiled SQLite.
      - name: Tests inside the image
        run: docker run --rm -v "$PWD:/src" -w /src "infohub:$APP_VERSION" python -m unittest discover -s tests
      # migrate then web, as production starts them (the worker would crawl the internet).
      - name: Start the image like production
        run: |
          docker compose up -d infohub
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/live > /dev/null && break
            sleep 2
          done
          curl -sS http://127.0.0.1:8000/api/health > health.json
          python3 - <<'PY'
          import json, os
          health = json.load(open("health.json"))
          runtime = health["runtime"]
          print(json.dumps({"version": health["version"], **{k: runtime[k] for k in
                ("environment", "process_role", "sqlite_version", "sqlite_wal_reset_safe")}}))
          assert health["version"] == os.environ["APP_VERSION"], health["version"]
          assert runtime["environment"] == "production" and runtime["process_role"] == "web"
          assert runtime["sqlite_wal_reset_safe"] is True, runtime["sqlite_version"]
          PY
      - name: Logs
        if: always()
        run: docker compose logs --no-color
