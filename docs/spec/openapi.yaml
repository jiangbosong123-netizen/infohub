components:
  securitySchemes:
    ConsumerToken: {type: http, scheme: bearer, description: 'Opaque consumer token; server stores only its hash.
        Scopes are defined by x-required-scopes, not OAuth2. No default administrator scope.'}
  schemas:
    ObjectRef:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        version_id: {type: string, minLength: 1, maxLength: 128}
      required:
      - id
      - version_id
      additionalProperties: false
    SubjectRef:
      type: object
      properties:
        type:
          type: string
          enum:
          - document
          - event
          - report
        id: {type: string, minLength: 1, maxLength: 128}
        version_id: {type: string, minLength: 1, maxLength: 128}
      required:
      - type
      - id
      - version_id
      additionalProperties: false
    InputRef:
      type: object
      properties:
        resource_type:
          type: string
          enum:
          - document
          - event
          - evidence
          - entity
          - topic
          - report
        id: {type: string, minLength: 1, maxLength: 128}
        version_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        role: {type: string}
        content_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      required:
      - resource_type
      - id
      - version_id
      - role
      - content_sha256
      additionalProperties: false
    PublisherRef:
      type: object
      properties:
        id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        attribution_status:
          type: string
          enum:
          - identified
          - uncertain
          - unknown
      required:
      - id
      - name
      - attribution_status
      additionalProperties: false
    SourceRef:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        raw_record_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        observed_at: {type: string, format: date-time, pattern: '(Z|[+-]\d{2}:\d{2})$'}
      required:
      - id
      - raw_record_id
      - observed_at
      additionalProperties: false
    ContentQuality:
      type: object
      properties:
        origin:
          type: string
          enum:
          - publisher_text
          - feed_excerpt
          - generated_metadata
          - legacy_unknown
        extent:
          type: string
          enum:
          - full
          - excerpt
          - title_only
          - none
        truncated: {type: boolean}
        extraction_status:
          type: string
          enum:
          - parsed
          - partial
          - failed
          - not_attempted
          - legacy_unverified
      required:
      - origin
      - extent
      - truncated
      - extraction_status
      additionalProperties: false
    Coverage:
      type: object
      properties:
        status:
          type: string
          enum:
          - complete_for_declared_scope
          - partial
          - unknown
        declared_scope: {type: string}
        eligible_count:
          anyOf:
          - {type: integer, minimum: 0}
          - {type: 'null'}
        included_count: {type: integer, minimum: 0}
        missing_source_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 128}
        limitations:
          type: array
          items: {type: string}
      required:
      - status
      - declared_scope
      - eligible_count
      - included_count
      - missing_source_ids
      - limitations
      additionalProperties: false
    EntityMention:
      type: object
      properties:
        entity_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        entity_version_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        evidence_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 128}
        status:
          type: string
          enum:
          - resolved
          - unresolved
          - ambiguous
        method: {type: string}
        method_version: {type: string}
      required:
      - entity_id
      - entity_version_id
      - evidence_ids
      - status
      - method
      - method_version
      additionalProperties: false
    TopicRef:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        version_id: {type: string, minLength: 1, maxLength: 128}
        method: {type: string}
        evidence_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 128}
      required:
      - id
      - version_id
      - method
      - evidence_ids
      additionalProperties: false
    AnalysisRef:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        task_type: {type: string}
        review_status:
          type: string
          enum:
          - unreviewed
          - accepted
          - rejected
          - corrected
        stale: {type: boolean}
      required:
      - id
      - task_type
      - review_status
      - stale
      additionalProperties: false
    Selection:
      type: object
      properties:
        selected: {type: boolean}
        policy_version: {type: string}
        reasons:
          type: array
          items: {type: string}
      required:
      - selected
      - policy_version
      - reasons
      additionalProperties: false
    DisplayProvenance:
      type: object
      properties:
        title_method:
          type: string
          enum:
          - source_language
          - translation
          - edited
        title_analysis_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        summary_analysis_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
      required:
      - title_method
      - title_analysis_id
      - summary_analysis_id
      additionalProperties: false
    Item:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        version_id: {type: string, minLength: 1, maxLength: 128}
        legacy_item_id:
          anyOf:
          - {type: integer, minimum: 1}
          - {type: 'null'}
        kind:
          type: string
          enum:
          - article
          - flash
          - filing
          - policy_release
          - research
          - commentary
          - transcript
          - other
        status:
          type: string
          enum:
          - active
          - withdrawn
          - restricted
          - duplicate_alias
        canonical_id:
          anyOf:
          - {type: string, minLength: 1, maxLength: 128}
          - {type: 'null'}
        title_original: {type: string}
        title_display: {type: string}
        summary_original:
          anyOf:
          - {type: string}
          - {type: 'null'}
        summary_display:
          anyOf:
          - {type: string}
          - {type: 'null'}
        canonical_url:
          anyOf:
          - {type: string, format: uri}
          - {type: 'null'}
        language: {type: string}
        display_provenance: {$ref: '#/components/schemas/DisplayProvenance'}
        content_quality: {$ref: '#/components/schemas/ContentQuality'}
        published_at:
          anyOf:
          - {type: string, format: date-time, pattern: '(Z|[+-]\d{2}:\d{2})$'}
          - {type: 'null'}
        published_precision:
          type: string
          enum:
          - instant
          - minute
          - day
          - month
          - unknown
        time_status:
          type: string
          enum:
          - parsed
          - missing
          - invalid
          - future_suspect
          - legacy_unverified
        first_seen_at: {type: string, format: date-time, pattern: '(Z|[+-]\d{2}:\d{2})$'}
        available_at: {type: string, format: date-time, pattern: '(Z|[+-]\d{2}:\d{2})$'}
        publisher: {$ref: '#/components/schemas/PublisherRef'}
        source_refs:
          type: array
          items: {$ref: '#/components/schemas/SourceRef'}
        entity_mentions:
          type: array
          items: {$ref: '#/components/schemas/EntityMention'}
        topic_refs:
          type: array
          items: {$ref: '#/components/schemas/TopicRef'}
        event_refs:
          type: array
          items: {$ref: '#/components/schemas/ObjectRef'}
        analysis_refs:
          type: array
          items: {$ref: '#/components/schemas/AnalysisRef'}
        processing_state:
          type: string
          enum:
          - pending
          - processing
          - ready
          - partial
          - insufficient_evidence
          - failed
          - blocked
        point_in_time_eligible: {type: boolean}
        importance_score:
          anyOf:
          - {type: number, minimum: 0, maximum: 100}
          - {type: 'null'}
        selection:
          anyOf:
          - {$ref: '#/components/schemas/Selection'}
          - {type: 'null'}
